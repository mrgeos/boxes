# Проверки на каждый PR и пуш в основную ветку: ESLint и порядок модулей, собранный файл в репозитории
# совпадает со сборкой из src/, тесты в браузере (они собирают файл заново).
name: test
on:
  pull_request:
  push:
    branches: [claude/3d-box-mockup-designer-vq4cwt]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node build.mjs --check
      - run: npm test
